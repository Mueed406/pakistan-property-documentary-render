name: Check Gemini Urdu voice integration (free, no API calls)

on:
  push:
    branches: [main]
    paths:
      - gemini_tts_lab.py
      - tests/test_gemini_tts_lab.py
      - .github/workflows/check-gemini-voice-code.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install requests
        run: python -m pip install "requests>=2.31,<3"
      - name: Compile Python
        run: python -m py_compile gemini_tts_lab.py
      - name: Run fake-audio and prompt tests without network
        run: python -m unittest discover -s tests -p test_gemini_tts_lab.py -v
      - name: Dry run narration instructions
        run: python gemini_tts_lab.py --dry-run > /dev/null
