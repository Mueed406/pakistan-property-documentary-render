name: Verify newly updated Gemini key — one voice sample

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check-new-gemini-key.yml
      - gemini_tts_lab.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini_key_one_voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install safe TTS client
        run: python -m pip install 'requests>=2.31,<3'
      - name: Validate TTS code
        run: |
          python -m py_compile gemini_tts_lab.py
          python gemini_tts_lab.py --dry-run > /dev/null
      - name: Check new API key without exposing it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo "Missing Gemini secret" && exit 1)
          python gemini_tts_lab.py --voices Charon
      - name: Upload actual 1 voice sample
        uses: actions/upload-artifact@v4
        with:
          name: gemini-new-key-one-urdu-sample
          path: |
            gemini_voice_output/*.wav
            gemini_voice_output/*.json
            gemini_voice_output/*.txt
          retention-days: 7
          if-no-files-found: error
