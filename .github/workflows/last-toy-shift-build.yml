name: The Last Toy Shift — 3D Source Gate
on:
  push:
    branches:
      - feature/last-toy-shift-cinematic-production-20261017
  pull_request:
    paths:
      - 'films/the-last-toy-shift/**'
      - 'templates/fan-animation/**'
      - '.github/workflows/last-toy-shift-build.yml'
jobs:
  compile-and-plan-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: films/the-last-toy-shift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned app dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript and Vite build
        run: npm run build
      - name: Structural 5400-frame check (NOT media proof)
        run: npm run validate
