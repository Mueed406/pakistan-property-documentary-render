name: Last Toy Shift — Real Skinned GLB Proof (NOT FINAL)
on:
  push:
    branches: [feature/last-toy-shift-cinematic-production-20261017]
    paths:
      - '.github/workflows/last-toy-shift-cc0-skeleton-proof.yml'
  workflow_dispatch:
jobs:
  real-skeleton:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: films/the-last-toy-shift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies and video tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg
      - name: Acquire verified CC0 SKINNED GLB (no proprietary models)
        run: node scripts/acquire-cc0-rig.mjs
      - name: Validate TypeScript WebGL scene
        run: npm run build
      - name: Render actual 4-second skeletal motion
        run: npm run render -- --mode=rigproof --start=1800 --end=2040 --width=360 --height=640
      - name: Verify exactly 240 rendered frames at 60 fps
        run: |
          FILE=$(find output -maxdepth 1 -type f -name 'RIGPROOF_CC0_240FRAMES_1800_2040_NOT_FINAL_*.mp4' | head -1)
          test -n "$FILE"
          node scripts/check_proof.mjs "$FILE" 240
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-toy-shift-cc0-skeletal-rigproof-NOT-FINAL
          path: films/the-last-toy-shift/output/RIGPROOF_CC0_*.mp4
          if-no-files-found: ignore
          retention-days: 7
