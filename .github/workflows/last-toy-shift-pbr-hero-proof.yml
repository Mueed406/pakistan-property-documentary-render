name: Last Toy Shift — CC0 PBR Material + Rig Motion Proof
on:
  push:
    branches: [feature/last-toy-shift-cinematic-production-20261017]
    paths:
      - '.github/workflows/last-toy-shift-pbr-hero-proof.yml'
  workflow_dispatch:
jobs:
  pbr-actor-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: films/the-last-toy-shift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebGL2 and video tools
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Acquire and MD5/SHA256 verify CC0 rig and PBR maps
        run: |
          node scripts/acquire-cc0-rig.mjs
          node scripts/acquire-cc0-pbr.mjs
      - name: Build and validate timeline
        run: |
          npm run build
          npm run validate
      - name: Render 120 deterministic rigged/PBR frames
        run: npm run render -- --mode=rigproof --start=1800 --end=1920 --width=360 --height=640
      - name: Verify encoded MP4 120 frames
        run: |
          FILE=$(find output -maxdepth 1 -name 'RIGPROOF_CC0_120FRAMES_1800_1920_NOT_FINAL_*.mp4' | head -1)
          test -n "$FILE"
          node scripts/check_proof.mjs "$FILE" 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: last-toy-shift-CC0-PBR-rig-proof-NOT-FINAL
          path: |
            films/the-last-toy-shift/output/RIGPROOF_CC0_*.mp4
            films/the-last-toy-shift/public/assets/pbr/CC0_rusty_metal_sheet_asset_manifest.json
          retention-days: 7
          if-no-files-found: ignore
