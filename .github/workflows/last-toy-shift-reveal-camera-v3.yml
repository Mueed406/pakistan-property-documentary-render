name: Last Toy Shift — Real Creature Reveal V3 No Camera Clipping
on:
  push:
    branches: [feature/last-toy-shift-cinematic-production-20261017]
    paths: ['.github/workflows/last-toy-shift-reveal-camera-v3.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  final-stalker-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    defaults:
      run:
        working-directory: films/the-last-toy-shift
    steps:
      - uses: actions/checkout@v4
      - name: Download verified original Threadjaw skeletal GLB
        uses: actions/download-artifact@v4
        with:
          name: last-toy-shift-ORIGINAL-Threadjaw-3D-and-video-NOT-FINAL
          run-id: 39063523037
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: films/the-last-toy-shift
      - name: Validate original creature source
        run: |
          sha256sum public/assets/original_threadjaw_stalker.glb | grep '^46520ab77450d86f2c6445d96f2b5577dce0067ec3626c83faeb8ab87cab2391'
      - name: Install WebGL renderer, source and FFmpeg
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download and verify CC0 original metal textures
        run: node scripts/acquire-cc0-pbr.mjs
      - name: Typecheck film, compile, and validate manifest
        run: |
          npm run build
          npm run validate
      - name: Real 540-frame face-oriented jumpscare at 540x960 60 FPS
        run: npm run render -- --mode=threadjaw --start=4560 --end=5100 --width=540 --height=960
      - name: Verify full 540 video frames
        run: |
          FILE=$(find output -maxdepth 1 -name 'THREADJAW_ORIGINAL_540FRAMES_4560_5100_NOT_FINAL_*.mp4' | head -1)
          test -n "$FILE"
          node scripts/check_proof.mjs "$FILE" 540
      - name: Upload face-oriented, non-clipping ending scene and metadata
        uses: actions/upload-artifact@v4
        with:
          name: repaired-film-shot-10-v3-framed-creature-60fps
          path: |
            films/the-last-toy-shift/output/THREADJAW_ORIGINAL_*.mp4
            films/the-last-toy-shift/output/THREADJAW_ORIGINAL_*.mp4.json
          if-no-files-found: error
          retention-days: 14
