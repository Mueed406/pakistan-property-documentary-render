name: Premium documentary color quality check
on:
  workflow_run:
    workflows: ["PPG Premium Pearl — Full 410s 24-Motion Documentary"]
    types: [completed]
permissions:
  contents: read
  actions: read
jobs:
  palette_qc:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install FFmpeg and image analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow
      - name: Download completed 410s movie
        uses: actions/download-artifact@v4
        with:
          name: PPG-PREMIUM-PEARL-24-MOTION-FULL-410s-MP4
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: film
      - name: Check twenty-four scenes for chroma artifacts and palette
        run: |
          python editorial/premium_color_motion_qc.py --video film/renders/Pakistan_Property_Premium_Pearl_24_Motion_FullHD_Review.mp4 --report film/renders/Pakistan_Property_Premium_Pearl_24_Motion_FullHD_Review.report.json --out pearl_qc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PPG-Premium-24-Scene-Color-QC-ContactSheet
          path: pearl_qc
          retention-days: 7
          if-no-files-found: ignore
