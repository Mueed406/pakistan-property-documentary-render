name: Property Comedy V4 — Authenticated CC0 Asset Research
on:
  pull_request:
    paths:
      - 'shorts/property-funny-v4/fetch_assets.py'
      - '.github/workflows/property-funny-v4-assets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect_cc0_photo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'Pillow>=10,<12'
      - name: Download and validate the researched 4K CC0 chai photograph
        run: python shorts/property-funny-v4/fetch_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: PPG-V4-Researched-Karachi-Chai-CC0
          path: shorts/property-funny-v4/assets/
          retention-days: 7
          if-no-files-found: error
