name: Recover finished 6m50 full motion film (reuse 8 rendered HD scenes)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-full-motion-documentary.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover_complete_movie:
    runs-on: windows-2025
    timeout-minutes: 65
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Obtain original 410-second feature film and synchronized Urdu subtitles
        uses: actions/download-artifact@v4
        with:
          name: pakistan-property-urdu-stock-documentary
          run-id: "38962816235"
          github-token: ${{ github.token }}
          path: baseline
      - name: Recover all eight finished 1080p HTML motion scene MP4 files
        uses: actions/download-artifact@v4
        with:
          name: PPG-FullMotion-Build-Diagnostics
          run-id: "38995893640"
          github-token: ${{ github.token }}
          path: recovery
      - name: Install FFmpeg encoder
        shell: pwsh
        run: |
          if(-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)){choco install ffmpeg -y --no-progress}
      - name: Check recovered real media and original audio are complete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path motion-output -Force | Out-Null
          $files = Get-ChildItem recovery -Recurse -Filter "scene_*.mp4"
          if($files.Count -ne 8) { throw "Expected exactly eight previously rendered scenes, found $($files.Count)" }
          foreach($f in $files){Copy-Item $f.FullName -Destination (Join-Path motion-output $f.Name)}
          if(-not (Test-Path "baseline/renders/Pakistan_Property_Stock_Documentary_FINAL.mp4")){throw "Missing full stock feature"}
          if(-not (Test-Path "baseline/urdu_timed.srt")){throw "Missing Urdu cue timing"}
          python -m py_compile browser_motion/full_documentary_assemble.py
          Write-Host "Recovered all 8 professionally rendered moving graphics — no rerender needed"
      - name: Reassemble full 1080p movie with original audio and all 8 motion sequences
        shell: pwsh
        run: |
          python browser_motion/full_documentary_assemble.py --base baseline/renders/Pakistan_Property_Stock_Documentary_FINAL.mp4 --srt baseline/urdu_timed.srt --motion-dir motion-output --out renders/Pakistan_Property_Full_Browser_Motion_Review.mp4 --work full_motion_segments
          if($LASTEXITCODE -ne 0){throw "Encoding failed"}
      - name: Verify professional video artifact exists and is 6–7 min
        shell: pwsh
        run: |
          $v='renders/Pakistan_Property_Full_Browser_Motion_Review.mp4'
          $q='renders/Pakistan_Property_Full_Browser_Motion_Review.qc.json'
          if(-not(Test-Path $v) -or -not(Test-Path $q)){throw "Missing finished film / QC"}
          $d = [double](ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 $v)
          if($d -lt 359 -or $d -gt 427){throw "Wrong full-film duration: $d"}
          $f=Get-Item $v
          if($f.Length -lt 22000000){throw "Unexpected tiny video, refuse upload"}
          Write-Host "SUCCESS: $d seconds, $($f.Length) bytes"
      - name: Upload actual FULL movie for personal review
        uses: actions/upload-artifact@v4
        with:
          name: PPG-Full-410sec-HD-MOTION-DOCUMENTARY
          path: |
            renders/Pakistan_Property_Full_Browser_Motion_Review.mp4
            renders/Pakistan_Property_Full_Browser_Motion_Review.qc.json
            renders/Pakistan_Property_Full_Browser_Motion_Review.edl.json
            baseline/urdu_timed.srt
            browser_motion/full_documentary_scenes.html
          retention-days: 7
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PPG-Recovery-Diagnostics
          path: |
            renders/*.json
            full_motion_segments/*.txt
          retention-days: 3
          if-no-files-found: ignore
