<!doctype html><html lang="ur" dir="rtl"><head><meta charset="utf-8"/><title>PPG Narration-synced cinematic graphics</title><style>
@font-face{font-family:Naskh;src:local('Noto Naskh Arabic');}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#08121c}
canvas{display:block;width:100%;height:100%;object-fit:contain}
</style></head><body><canvas id="frame"></canvas><script>
(()=>{
"use strict";
const q=new URLSearchParams(location.search),scene=Number(q.get('scene')||0);
const W=Number(q.get('width')||1920),H=Number(q.get('height')||1080);
if(!Number.isInteger(scene)||scene<0||scene>7)throw Error("scene should be an integer 0–7");
const cv=document.querySelector('canvas'),g=cv.getContext('2d',{alpha:false});cv.width=W;cv.height=H;
const pi=Math.PI;
const E=(a,b,t)=>{let k=Math.max(0,Math.min(1,(t-a)/(b-a)));return k*k*(3-2*k)};
const sat=(x)=>Math.min(1,Math.max(0,x));
const FONT='"Noto Naskh Arabic","Segoe UI",sans-serif';
const LABELS=[
 ['ایک سوال، ہزاروں فائلیں','HOW MANY FILES CAN FIT ON REAL LAND?'],
 ['کاغذی فائل بمقابلہ حقیقی پلاٹ','A FILE IS NOT A PHYSICAL PLOT'],
 ['زمین کی اصل گنجائش','LAND CAPACITY IS FINITE'],
 ['عمارتوں اور نقشوں کا وعدہ','A RENDER IS NOT PROOF OF A BUILDING'],
 ['تحقیقات اور ریکارڈ','FOLLOW THE DOCUMENT TRAIL'],
 ['منظوری اور قانونی حیثیت','VERIFY THE OFFICIAL APPROVAL'],
 ['خریدار کی لازمی جانچ','FOUR CHECKS BEFORE YOU PAY'],
 ['ثبوت دیکھیں، پھر فیصلہ کریں','VERIFY THE LAND. VERIFY THE RECORDS.']
];
function line(x1,y1,x2,y2,col='#77a3a7',w=2){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();}
function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h);}
function rounded(x,y,w,h,r,color){g.beginPath();g.roundRect(x,y,w,h,r);g.fillStyle=color;g.fill();}
function text(t,x,y,size,color='#f4f2ec',align='right',weight=600,lat=false){g.fillStyle=color;g.textAlign=align;g.textBaseline='middle';g.font=weight+' '+size+'px '+(lat?'Arial,sans-serif':FONT);g.fillText(t,x,y);}
function polygon(pts,fill,stroke=null,width=1){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();g.fillStyle=fill;g.fill();if(stroke){g.strokeStyle=stroke;g.lineWidth=width;g.stroke();}}
function proj(x,y,z){return [1150+(x-y)*27,568+(x+y)*13.3-z*28];}
function parcel(x,y,raised=0,hi=false,p=1){const a=proj(x,y,raised),b=proj(x+1.8,y,raised),c=proj(x+1.8,y+1.8,raised),d=proj(x,y+1.8,raised);const bb=proj(x+1.8,y,0),cc=proj(x+1.8,y+1.8,0);g.globalAlpha=p;polygon([b,c,cc,bb],hi?'#16626e':'#142c38');polygon([a,b,c,d],hi?'#5cbebc':'#354750',hi?'#a9fff4':'#8199a0',1.7);g.globalAlpha=1;}
function card(x,y,k,t,show,rot=0){
 g.save();g.globalAlpha=show;g.translate(x,y);g.rotate(rot);g.shadowBlur=21;g.shadowColor='rgba(0,0,0,.45)';
 rounded(-115,-145,230,290,11,'#e2ded3');g.shadowBlur=0;
 rect(-93,-109,66,9,'#be835f');for(let j=0;j<7;j++)rounded(-92,-57+j*31,178-(j%3)*25,4,2,'#687b84');
 rounded(-94,108,78,13,3,'#a85c49');
 text(t,86,-116,13,'#314b53','right',700,true);
 g.restore();
}
function frame(t){
 g.setTransform(W/1920,0,0,H/1080,0,0);
 rect(0,0,1920,1080,'#09131e');
 const grd=g.createLinearGradient(0,0,1920,1080);grd.addColorStop(0,'#09131c');grd.addColorStop(.58,'#182b36');grd.addColorStop(1,'#051018');rect(0,0,1920,1080,grd);
 const glow=g.createRadialGradient(1350,490,25,1350,490,950);glow.addColorStop(0,'rgba(22,136,144,.26)');glow.addColorStop(1,'rgba(11,21,31,0)');rect(0,0,1920,1080,glow);
 g.save();g.globalAlpha=.04;for(let i=0;i<=1920;i+=72)line(i,0,i,1080,'#bdffff',1);for(let i=0;i<=1080;i+=72)line(0,i,1920,i,'#bdffff',1);g.restore();
 // Cinematic, intentionally restrained lens sweeps and physical light falloff.
 const spot=300+Math.sin(t*.33+scene)*80;
 const rim=g.createLinearGradient(700,0,1700,750);rim.addColorStop(0,'transparent');rim.addColorStop(.72,'rgba(68,166,182,.055)');rim.addColorStop(1,'transparent');rect(0,0,1920,1080,rim);
 const show=E(.1,1,t);
 g.save();g.globalAlpha=show;
 text('PAKISTAN PROPERTY GROUP  /  DOCUMENTARY ANALYSIS',115,93,20,'#9dbbbf','left',700,true);
 text(LABELS[scene][0],1020,201,65,'#f2f1e9','right',800);
 text(LABELS[scene][1],120,265,21,'#ddb78c','left',700,true);
 g.restore();
 if(scene===0){
  for(let i=0;i<8;i++){const z=E(.3+i*.18,1.8+i*.12,t);card(1310+(i%4)*107,600-Math.floor(i/4)*70,i,'FILE',z,(-.04+i*.01));}
  text('42,000',915,515,143,'#efbf87','right',800,true);
  text('6,000',915,666,101,'#69d7d1','right',800,true);
  text('REPORTED FILES',125,531,23,'#aabfc3','left',700,true);
  text('REPORTED PLOT CAPACITY',125,688,23,'#aabfc3','left',700,true);
  line(105,577,917,577,'#556b75',2);
 }else if(scene===1){
  for(let i=0;i<6;i++)card(485+(i%3)*65,657-Math.floor(i/3)*67,i,'ALLOTMENT',E(.6+i*.14,1.9+i*.14,t),-.07+i*.035);
  for(let ix=0;ix<7;ix++)for(let iy=0;iy<5;iy++){let a=E(2.2+(ix+iy)*.09,4.2,t);parcel(ix*2.25,iy*2.25,a*1.15,(ix+iy*3)%4===0,a);}
  text('PAPER RECORD',475,893,27,'#e9c7a0','center',700,true);
  text('PHYSICAL LAND',1309,893,27,'#6ae2d6','center',700,true);
  text('≠',971,707,108,'#e9ede9','center',700,true);
 }else if(scene===2){
  for(let ix=0;ix<13;ix++)for(let iy=0;iy<9;iy++){
   let a=E(.6+(ix+iy)*.035,2.15+(ix+iy)*.03,t),chosen=(ix*19+iy*7)%10===0;
   parcel(ix*1.85,iy*1.85,chosen*a*2,chosen,a);
  }
  text('LAND IS LIMITED',715,530,74,'#e8dbc2','right',800,true);
  text('EXTRA FILES DO NOT CREATE EXTRA LAND',775,611,25,'#bfced1','right',700,true);
 }else if(scene===3){
  const up=E(.8,3.2,t);
  for(let b=0;b<5;b++){
   const px=1100+b*131,py=730+b%2*31,height=(2+b%3)*105*up;
   polygon([[px,py],[px+110,py-30],[px+110,py-height-30],[px,py-height]],'#425967','#8cbbc2');
   polygon([[px+110,py-30],[px+150,py-53],[px+150,py-height-53],[px+110,py-height-30]],'#1a3846','#688f9a');
   for(let w=0;w<3;w++)for(let level=0;level<3+b%3;level++){
    const yy=py-52-level*38;
    if(yy>py-height+18)rounded(px+12+w*30,yy,21,23,2,(w+level)%4?'#5a92a3':'#ebc68b');
   }
  }
  text('ARCHITECTURAL MODEL',790,575,41,'#f1d5b5','right',800,true);
  text('VERIFY APPROVED DRAWINGS AND REAL CONSTRUCTION',800,647,21,'#bdcbd2','right',700,true);
 }else if(scene===4){
  // Layered forensic evidence web uses distinct moving lines and physical paperwork.
  const pts=[[1080,440],[1370,320],[1510,590],[1260,780],[1680,775]];
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++)if((i+j)%2===1){
   let p=E(.5+(i+j)*.19,2.8+(i+j)*.1,t);line(pts[i][0],pts[i][1],pts[i][0]+(pts[j][0]-pts[i][0])*p,pts[i][1]+(pts[j][1]-pts[i][1])*p,'rgba(94,199,210,.65)',3);
  }
  pts.forEach((p,i)=>{let a=E(1+i*.25,2.3+i*.25,t);g.globalAlpha=a;g.shadowColor='#70d1d2';g.shadowBlur=25;g.fillStyle=i===2?'#e6af71':'#7dd5d8';g.beginPath();g.arc(p[0],p[1],13,0,Math.PI*2);g.fill();g.shadowBlur=0;g.globalAlpha=1;});
  for(let i=0;i<4;i++)card(335+i*75,675-i*35,i,'RECORD',E(.6+i*.2,2.5,t),(-i*.07));
  text('SOURCE → PAYMENT → ALLOTMENT',1660,940,26,'#e7e9e7','right',700,true);
 }else if(scene===5){
  const stages=[['1','SCHEME RECORD'],['2','LAYOUT APPROVAL'],['3','LAND / PLOT ID']];
  stages.forEach((a,i)=>{const k=E(.7+i*.77,2.4+i*.72,t),x=325+i*500,y=587;
   g.save();g.globalAlpha=k;
   g.strokeStyle=i<2?'#d6b28a':'#75d9d3';g.lineWidth=5;g.beginPath();g.arc(x,y,88,0,2*pi);g.stroke();
   text(a[0],x,y+12,86,'#eff5f2','center',800,true);
   text(a[1],x,y+141,25,'#d4dcda','center',800,true);
   g.restore();
   if(i<2)line(x+110,y,x+388*E(1.4+i*.7,3+i*.7,t),y,'#82adb8',3);
  });
  text('ONE CERTIFICATE IS NOT UNIVERSAL APPROVAL',1667,909,27,'#eacaa7','right',700,true);
 }else if(scene===6){
  const labels=['OFFICIAL NOC','ACTUAL LAND','LEGAL DEEDS','SITE VISIT'];
  labels.forEach((tx,i)=>{const k=E(.5+i*.49,2+i*.49,t),x=230+(i%2)*635,y=418+Math.floor(i/2)*210;
   g.save();g.globalAlpha=k;
   rounded(x,y,565,151,14,'#152d37');g.strokeStyle='#467c85';g.lineWidth=2;g.strokeRect(x,y,565,151);
   const p=20*E(.7+i*.49,2.3+i*.49,t);
   g.strokeStyle='#70e1d6';g.lineWidth=9;g.beginPath();g.moveTo(x+32,y+82);g.lineTo(x+53,y+104-p*.2);g.lineTo(x+96,y+50);g.stroke();
   text(tx,x+515,y+83,28,'#f5f4f0','right',800,true);
   g.restore();
  });
 }else{
  for(let i=0;i<4;i++){const z=E(.5+i*.4,2+i*.4,t);card(425+i*300,712-i*15,i,'VERIFIED',z,(-.13+i*.08));}
  text('VERIFY BEFORE YOU BUY',1035,888,43,'#71dbd5','center',800,true);
 }
 g.save();g.globalAlpha=E(4.6,5.9,t);rounded(95,965,1732,58,2,'#111e26');text('ILLUSTRATIVE DOCUMENTARY GRAPHICS  •  REPORTED ALLEGATIONS, NOT COURT FINDINGS',117,996,21,'#e0dfd9','left',700,true);g.restore();
 const vignette=g.createRadialGradient(960,500,290,960,500,1160);vignette.addColorStop(0,'transparent');vignette.addColorStop(1,'rgba(0,0,0,.49)');rect(0,0,1920,1080,vignette);
}
window.renderAt=t=>frame(Math.max(0,Number(t)||0));
window.motionInfo={width:W,height:H,scene,duration:7.5,fps:25,title:LABELS[scene][1]};
document.fonts.ready.then(()=>{frame(0);window.__ready=true;});
})();
</script></body></html>
