// Spatially accurate page-edge matte: the outgoing shot remains visible

function paperReveal(nextScene,prevScene,k,prevTime,prevDur,nextTime,nextDur){
 sceneDraw(prevScene,prevTime,prevDur);
 c.save();
 const edge=-65+(W+135)*ease(k),jag=[];
 c.beginPath();c.moveTo(-4,-4);

 sceneDraw(nextScene,nextTime,nextDur);
 c.restore();
 // Fibrous edge/light shadow follows the same matte geometry.
 c.save();c.globalAlpha=.75*(1-ease(Math.abs(k-.5)*1.5));
 c.beginPath();jag.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));
 c.lineWidth=8;c.strokeStyle=C.paper;c.stroke();c.restore();
}

 const pop=impact*Math.sin(local*32)*Math.exp(-local*2.7);
