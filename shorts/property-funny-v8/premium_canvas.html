<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<style>
@font-face{font-family:InterDisplay;src:url('file:///usr/share/fonts/opentype/inter/InterDisplay-Black.otf')}
@font-face{font-family:InterBold;src:url('file:///usr/share/fonts/opentype/inter/InterDisplay-Bold.otf')}

canvas{display:block;width:1080px;height:1920px}
</style></head><body><canvas width="1080" height="1920" id="stage"></canvas>
<script>
'use strict';
const C=document.querySelector('#stage'),g=C.getContext('2d',{alpha:false}),W=1080,H=1920;
const AS='assets/';
const names=['paper_fiber_texture','office_background_plate','dealer_pitch','dealer_point','dealer_tea','dealer_shocked','dealer_celebrate','buyer_thinking','buyer_surprised','buyer_skeptical','buyer_smirk','buyer_documents','tea_single','tea_saucer','tea_splash','torn_paper_01','torn_paper_02','torn_paper_03','torn_paper_04','torn_paper_05','torn_paper_06','torn_paper_07','torn_paper_08'];
const img={};function newImage(src){const x=new Image();x.src=src;return new Promise((resolve)=>{x.onload=()=>resolve(x);x.onerror=()=>resolve(null)})}
const cues=[];let total=63.7,voiceEnd=58.7;
const titles=[['PROPERTY KA','SCENE!'],['KAL RATE','DOUBLE!'],['PLOT','KAHAAN HAI?'],['BROCHURE','VS REALITY'],['NOC?','OWNERSHIP?'],['CHAI 100%','ASLI HAI!'],['PLOT KAB','ASLI HOGA?'],['RESEARCH','BEFORE CASH'],['CHECK YOUR','DOCUMENTS'],['PAKISTAN','PROPERTY GROUP'],['SUBSCRIBE','BEFORE DEAL'],['CHAI MERI','TARAF SE!'],['PROPERTY','MORE FUN!']];
const subtitles=[
'پاکستان میں پراپرٹی کا کاروبار؟ یہاں پلاٹ سے پہلے خوابوں کی بکنگ ہو جاتی ہے!',
'سر! آج فائل اٹھا لیں، کل ریٹ ڈبل! پرسوں آپ خود ڈیلر!',
'واہ! مگر پلاٹ کہاں ہے؟',
'سر! یہ نقشہ دیکھیں، اتنا خوبصورت کہ زمین بھی شرما جائے!',
'اچھا! این او سی؟ ملکیت؟ قبضہ کب؟',
'ایک منٹ، سر! ہماری چائے سو فیصد اصلی ہے!',
'چائے تو اصلی ہے... پلاٹ کب اصلی ہوگا، باس؟',
'مذاق اپنی جگہ۔ لوکیشن خود دیکھیں، منظوری ادارے سے چیک کریں۔',
'ملکیت، رجسٹری اور سارے چارجز لکھ کر لیں۔ بڑا بورڈ گارنٹی نہیں!',
'پاکستان پراپرٹی گروپ — پہلے تحقیق، پھر سرمایہ کاری!',
'اگلا پلاٹ بھی چیک کروانا ہے؟ سبسکرائب کرو!',
'اور چائے میری طرف سے!',
'پاکستان پراپرٹی گروپ — سبسکرائب کریں!'
];
let stock=[];
window.init=async function(initCues, duration, end){
 cues.length=0;cues.push(...initCues);total=duration;voiceEnd=end;
 const p=names.map(async n=>img[n]=await newImage(AS+n+'.png'));
 // Stock footage is 12 real observed frames/second, converted from the project's licensed 25fps source.
 stock=[[],[],[]];for(let j=0;j<3;j++){for(let k=1;k<=84;k++)p.push(newImage(AS+`stock_frames/stock${j}_${String(k).padStart(3,'0')}.jpg`).then(x=>stock[j][k-1]=x));}
 await Promise.all(p);if(document.fonts&&document.fonts.ready)await document.fonts.ready;
 window.__ready=true;window.renderAt(0);
 return Object.fromEntries(names.map(n=>[n,!!img[n]]));
};
function clamp(x,a=0,b=1){return Math.max(a,Math.min(b,x))}function ease(x){x=clamp(x);return x*x*(3-2*x)}
function alpha(a,fn){g.save();g.globalAlpha*=clamp(a);fn();g.restore()}
function fill(x,y,w,h,color){g.fillStyle=color;g.fillRect(x,y,w,h)}
function picture(o,x,y,w,h,angle=0, opacity=1, shadow=false){if(!o)return;g.save();g.globalAlpha*=clamp(opacity);g.translate(x+w/2,y+h/2);g.rotate(angle);if(shadow){g.shadowColor='rgba(22,17,15,.3)';g.shadowBlur=38;g.shadowOffsetY=23;}g.drawImage(o,-w/2,-h/2,w,h);g.restore()}
function fontText(s,x,y,size,color='#101827',weight='900',align='left',family='InterDisplay',maxW=980){g.save();g.fillStyle=color;g.textAlign=align;g.textBaseline='alphabetic';g.font=`${weight} ${size}px ${family}`;g.fillText(s,x,y,maxW);g.restore()}
function roundRect(x,y,w,h,r,color){g.fillStyle=color;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function line(x,y,x2,y2,color,width){g.strokeStyle=color;g.lineWidth=width;g.lineCap='round';g.beginPath();g.moveTo(x,y);g.lineTo(x2,y2);g.stroke()}
function circle(x,y,r,fill,stroke,width=5){g.beginPath();g.arc(x,y,r,0,Math.PI*2);if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.lineWidth=width;g.strokeStyle=stroke;g.stroke()}}
function blendMode(name,fn){g.save();g.globalCompositeOperation=name;fn();g.restore()}
function playhead(t){let i=cues.findIndex(v=>t>=v.start&&t<v.end+.02);if(t>=voiceEnd||i<0){i=t>=voiceEnd?12:Math.max(0,cues.findLastIndex(c=>c.start<=t));}return Math.max(0,i)}
function background(t,id){
 fill(0,0,W,H,'#F2E7CD');
 const d=img.paper_fiber_texture;if(d){g.save();g.globalAlpha=.32;g.drawImage(d,(Math.sin(t*.25)*12)-25,(Math.cos(t*.22)*10)-20,1130,1960);g.restore()}
 // vintage ruled paper background with slight parallax
 g.save();g.globalAlpha=.12;for(let y=50;y<1920;y+=92)line(0,y+4*Math.sin(t*.2),1080,y+4*Math.sin(t*.2),'#8A7454',2);g.restore();
 // vignettes and graphic continuity
 let r=g.createRadialGradient(540,680,160,540,900,1350);r.addColorStop(0,'rgba(255,252,235,.02)');r.addColorStop(1,'rgba(33,26,18,.18)');fill(0,0,W,H,r);
 if(id%2===1){alpha(.13,()=>{for(let i=0;i<24;i++){const cx=(i*67+25)%1080,cy=240+i*58;circle(cx,cy,3.5,'#5A4833')}})}
}
function metadata(t,id){
 roundRect(55,48,970,64,8,'#162334');fontText('PAKISTAN PROPERTY GROUP',83,94,33,'#F2E6B8','700','left','InterBold');
 fontText('FUNNY PROPERTY FILES',950,157,24,'#574F43','700','right','InterBold');
 line(73,172,1007,172,'#A88B64',2);
 const progress=t/total;fill(0,1907,1080,'13','#1C293B');fill(0,1907,1080*progress,13,'#F2C744');
}
function photoCard(t,id,s){
 let ix=id===0?0:id===3?1:2;let frames=stock[ix];if(!frames||!frames.length)return;
 const n=Math.floor((s*.98)%6*12),src=frames[Math.min(83,Math.max(0,n))];
 if(!src)return;
 g.save();g.translate(543+8*Math.sin(t),750+5*Math.cos(t));g.rotate(.017*Math.sin(t*.9));g.shadowColor='rgba(40,24,13,.42)';g.shadowBlur=50;g.shadowOffsetY=28;
 fill(-468,-272,938,534,'#FFFAF0');g.drawImage(src,-440,-240,880,440);
 fill(-440,208,880,31,'#121A29');fontText('REAL FOOTAGE  /  ILLUSTRATIVE CONTEXT',-414,229,19,'#E5DABF','600','left','InterBold');g.restore();
 // physical tape
 fill(332+8*Math.sin(t),492,155,28,'rgba(211,185,128,.76)');
}
function character(t,n,side,scale=1,y=760,pose=0){
 const x=side==='left'?70:573;let w=(n.startsWith('dealer')?425:392)*scale;
 let obj=img[n];if(!obj)return;
 let ratio=obj.naturalHeight/Math.max(1,obj.naturalWidth),h=w*ratio;
 // held stop-motion accent at 12fps, smooth cinematic camera remains 60fps
 const hold=Math.floor(t*12)/12;let bob=6*Math.sin(hold*4.1+pose)+4*Math.sin(t*.8);
 picture(obj,x+15*Math.sin(t*.9+pose),y+bob,w,h,.010*Math.sin(hold*3+pose),1,true);
}
function titlePaper(t,id,local){
 const entry=ease(local/.53),y=205+(1-entry)*-100;
 g.save();g.translate(0,y);
 picture(img.torn_paper_01,70,32,944,240,.025*Math.sin(t*.5),.99,true);
 const title=titles[id]||titles[0];let sz1=title[0].length>12?72:87,sz2=title[1].length>12?71:94;
 // slight ink-registration stagger
 const x=540+5*Math.sin(t*1.9),a=id%3===1?'#C7332F':'#112437';
 fontText(title[0],x,114,sz1,'#0D2231','900','center','InterDisplay');
 fontText(title[1],x,218,sz2,a,'900','center','InterDisplay');
 g.restore();
}
function captionPanel(t,id,local){
 if(id===12) return;
 const cue=cues[id]||{role:'narrator',text:subtitles[id]||'',start:0,end:1};
 const who=(cue.role||'narrator').toUpperCase();
 const accent=cue.role==='dealer'?'#BD332B':cue.role==='buyer'?'#187D7A':'#E1AF35';
 // Physical editorial-paper lower third, avoiding the older black dashboard block.
 g.save();g.shadowColor='rgba(31,23,17,.24)';g.shadowBlur=31;g.shadowOffsetY=13;
 roundRect(49,1570,982,261,23,'#FFF5DB');g.restore();
 picture(img.torn_paper_04,55,1562,974,64,0,.14);
 roundRect(67,1597,9,206,5,accent);
 roundRect(89,1587,who.length*17+124,43,6,'#192C3C');
 fontText(who,112,1618,25,'#F8ECCA','800','left','InterBold');
 const dur=Math.max(.01,(cue.end||1)-(cue.start||0));
 const progress=clamp(local/dur);
 fill(90,1814,888,5,'#DBCFB6');fill(90,1814,888*progress,5,accent);
 g.save();g.font='700 42px Urdu';g.direction='rtl';g.textAlign='center';g.fillStyle='#17293B';
 const string=(cue.text||subtitles[id]||'');let words=string.split(' '),rows=[],row='';
 for(const word of words){let next=(row?row+' ':'')+word;if(g.measureText(next).width>884&&row){rows.push(row);row=word}else row=next}
 if(row)rows.push(row);
 const fs=rows.length>3?34:42;g.font=`700 ${fs}px Urdu`;
 const y=1682+(rows.length===1?26:rows.length===2?0:-6);
 for(let j=0;j<Math.min(rows.length,3);j++)g.fillText(rows[j],540,y+j*52,880);
 g.restore();
}
function marker(t,id,local){
 const a=ease((local-.8)/.75);if(a===0)return;
 const xx=800,yy=1180,grow=110*a;
 g.save();g.strokeStyle='#D33230';g.lineWidth=13;g.lineCap='round';g.beginPath();g.moveTo(xx-grow,yy+130*a);g.quadraticCurveTo(xx-30,yy-80,xx+40,yy-70*a);g.stroke();
 line(xx+14,yy-69*a,xx+45,yy-76*a,'#D33230',10);line(xx+46,yy-76*a,xx+32,yy-40*a,'#D33230',10);g.restore();
}
function fileFolder(t,id,s){
 const y=828+12*Math.sin(t*1.1);const q=ease((s-.35)/.5);
 g.save();g.translate(530, y);g.rotate(-.038*Math.sin(t*.8));
 g.shadowColor='rgba(0,0,0,.25)';g.shadowBlur=22;g.shadowOffsetY=12;
 roundRect(-385,-235,770,620,24,'#FDF7E9');g.shadowBlur=0;
 line(-345,-147,345,-147,'#C8B9A2',5);
 fontText('PROPERTY FILE',-340,-170,43,'#26384D','900','left');
 const rows=id===4?['APPROVAL / NOC','OWNERSHIP','POSSESSION DATE']:id===8?['LAND RECORD','REGISTRY','ALL CHARGES']:['PLOT LOCATION','APPROVAL STATUS','OWNERSHIP RECORD'];
 for(let k=0;k<3;k++){
  const ry=-72+k*130,arr=ease((s-.45-k*.38)/.35);
  circle(-304,ry,24,'#14384A');fontText('✓',-322,ry+14,42,'#F7D25E');
  fontText(rows[k],-250+35*(1-arr),ry+14,39,'#1E3242','700','left','InterBold',560);
  line(-255,ry+40,-255+490*arr,ry+40,'#F0C34C',7);
 }
 g.restore();
}
function scene(t,id,s){
 if([0,3,7].includes(id)){
  photoCard(t,id,s);let n=id===0?'dealer_pitch':id===3?'dealer_point':'buyer_documents';character(t,n,id===7?'right':'left',id===3?.85:.88,930,id);
  if(id===0){character(t,'buyer_thinking','right',.79,1035,3)}
 }else if(id===1){character(t,'dealer_celebrate','left',1.12,690,1);alpha(ease((s-.9)/.5),()=>{roundRect(490,785,530,190,22,'#162639');fontText('2× TOMORROW?',755,900,48,'#F9D15F','900','center')});}
 else if(id===2){character(t,'buyer_surprised','right',1.24,690,2);marker(t,id,s);}
 else if(id===4||id===8){fileFolder(t,id,s);character(t,id===4?'buyer_skeptical':'buyer_documents','right',.64,1160,id)}
 else if(id===5){character(t,s>1.1?'dealer_tea':'dealer_pitch','left',1.05,720,5);
  if(s<1.1)picture(img.tea_single,600+(1-ease(s/1.1))*60,1070-160*ease(s/1.1),270,310,0,1,true);
  alpha(ease((s-.7)/.4),()=>{fontText('100% REAL CHAI',650,775,47,'#BC312C','900','center')});}
 else if(id===6){character(t,'buyer_smirk','right',1.15,790,6);picture(img.tea_saucer,55,1120+8*Math.sin(t*4),292,242,-.03,1,true);marker(t,id,s);}
 else if(id===9){picture(img.paper_fiber_texture,85,480,900,890,0,.17);character(t,'buyer_documents','right',.94,775,9);roundRect(80,975,535,130,15,'#172839');fontText('VERIFY BEFORE',113,1022,40,'#F2CF64');fontText('YOU INVEST',113,1080,42,'white');}
 else if(id===10){character(t,'buyer_smirk','right',1.06,750,10);subscribeButton(t,s);}
 else if(id===11){character(t,'dealer_tea','left',.98,740,11);circle(830,950,138,'#F1C34E');fontText('CHAI!',830,965,54,'#233042','900','center');}
 else if(id===12){outro(t,s)}
 if(![4,5,8,10,11,12].includes(id))marker(t,id,s);
}
function subscribeButton(t,s){const b=1+.07*Math.sin(Math.max(0,s)*5);g.save();g.translate(530,1250);g.scale(b,b);roundRect(-425,-95,850,165,34,'#D83533');fontText('SUBSCRIBE',0,19,91,'#FFFFFF','900','center','InterDisplay');g.restore();}
function outro(t,s){
 const v=1+.05*Math.sin(s*2.7);g.save();g.translate(540,785);g.scale(v,v);picture(img.dealer_tea,-405,-280,405,795);picture(img.buyer_smirk,20,-250,385,775);g.restore();
 fontText('PAKISTAN',540,500,89,'#162639','900','center');fontText('PROPERTY GROUP',540,615,85,'#BB272A','900','center');
 const b=1+.04*Math.sin(s*5);g.save();g.translate(540,1350);g.scale(b,b);roundRect(-430,-90,860,176,42,'#D62C31');fontText('SUBSCRIBE  ▶',0,28,80,'white','900','center');g.restore();
 fontText('REAL ESTATE. REAL RESEARCH.',540,1547,30,'#1E2D3C','700','center','InterBold');
}
function renderAt(t){
 t=clamp(t,0,total-.0001);const id=playhead(t);let cue=cues[Math.min(id,cues.length-1)];let s=id===12?t-voiceEnd:t-cue.start;
 background(t,id);metadata(t,id);
 // characters and paperwork are composited as separate PNG layers; no flattened still-as-video.
 scene(t,id,s);titlePaper(t,id,s);captionPanel(t,id,s);
 // transition is an actual masked paper reveal rather than a single-frame hard cut.
 const t0=id===12?voiceEnd:cue.start,delta=t-t0,trans=.38;
 if(delta>0&&delta<trans&&id>0){let k=1-ease(delta/trans);alpha(k*.52,()=>{
  fill(0,0,1080*k,1920,'#FAECCB');picture(img.torn_paper_07,1080*k-380,0,395,1920,.01,1,true);
 });}
 if(t<.5){alpha(1-ease(t/.48),()=>fill(0,0,W,H,'#0D1728'))}
}
window.renderAt=renderAt;
</script></body></html>
